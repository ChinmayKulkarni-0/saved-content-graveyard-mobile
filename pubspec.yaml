name: saved_content_graveyard
description: "Identify content in screenshots and get buy/stream links."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.7.0
  http: ^1.2.2

  # Image picking / handling
  image_picker: ^1.1.2
  receive_sharing_intent: ^1.4.5

  # URL launching
  url_launcher: ^6.3.1

  # Navigation
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true